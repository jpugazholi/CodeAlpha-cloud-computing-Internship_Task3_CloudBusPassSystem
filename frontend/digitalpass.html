<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Pass - Cloud Bus Pass</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo">
            <span>🚌</span>
            Cloud Bus Pass
        </div>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="apply-pass.html">Apply Pass</a>
            <a href="status.html">Status</a>
            <a href="digitalpass.html" class="active">
                Digital Pass
            </a>
            <a href="index.html">Logout</a>
        </nav>

    </header>


    <!-- ================= DIGITAL PASS ================= -->

    <main class="digital-pass-page">

        <div class="digital-header">

            <p class="welcome-text">
                DIGITAL BUS PASS
            </p>

            <h1>
                Your Digital Pass
            </h1>

            <p>
                Your approved bus pass is available here.
            </p>

        </div>


        <!-- ================= PASS CONTAINER ================= -->

        <div id="digitalPassContainer">

            <div class="digital-card">

                <div class="digital-icon">
                    🎫
                </div>

                <h2>
                    Loading Pass...
                </h2>

                <p>
                    Please wait while we load your digital pass.
                </p>

            </div>

        </div>


        <div class="digital-back">

            <a href="dashboard.html">
                ← Back to Dashboard
            </a>

        </div>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
