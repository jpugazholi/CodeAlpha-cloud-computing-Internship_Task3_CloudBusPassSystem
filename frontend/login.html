<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Cloud Bus Pass</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo">
            <span>🚌</span>
            Cloud Bus Pass
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html" class="active">Login</a>
            <a href="register.html">Register</a>
        </nav>

    </header>


    <!-- ================= LOGIN SECTION ================= -->

    <section class="form-section">

        <div class="form-card">

            <div class="form-header">

                <div class="form-icon">
                    🔐
                </div>

                <h1>Welcome Back</h1>

                <p>
                    Login to manage your bus pass.
                </p>

            </div>


            <form id="loginForm">

                <!-- EMAIL -->

                <div class="input-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <!-- ================= LOGIN TYPE ================= -->

<div class="input-group">

    <label for="loginType">
        Login As
    </label>

    <select id="loginType" required>

        <option value="user">
            User
        </option>

        <option value="admin">
            Admin
        </option>

    </select>

</div>


                <button
                    type="submit"
                    class="form-btn"
                >
                    Login
                </button>

            </form>


            <p class="form-footer">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>

        </div>

    </section>


    <script src="js/script.js"></script>

</body>

</html>
