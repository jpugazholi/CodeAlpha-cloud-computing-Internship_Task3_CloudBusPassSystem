<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Application Status - Cloud Bus Pass</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo">
            <span>🚌</span>
            Cloud Bus Pass
        </div>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="apply-pass.html">Apply Pass</a>
            <a href="status.html" class="active">Status</a>
            <a href="digitalpass.html">Digital Pass</a>
            <a href="index.html">Logout</a>
        </nav>

    </header>


    <!-- ================= STATUS SECTION ================= -->

    <main class="status-page">

        <div class="status-header">

            <p class="welcome-text">
                APPLICATION TRACKING
            </p>

            <h1>
                Application Status
            </h1>

            <p>
                Track your bus pass application here.
            </p>

        </div>


        <!-- ================= STATUS CARD ================= -->

        <div id="statusContainer">

            <div class="status-card">

                <div class="status-icon">
                    📋

                <h2>
                    Loading Application...
                </h2>

                <p>
                    Please wait while we load your application.
                </p>

            </div>

        </div>


        <div class="status-back">

            <a href="dashboard.html">
                ← Back to Dashboard
            </a>

        </div>

    </main>


    <script src="js/script.js"></script>
